<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Prévias de site · Gabriel Felipe</title>
  <style>
    :root { color-scheme: light dark; --fundo: #f7f6f2; --texto: #1d1d1f; --suave: #5f6368; --acento: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #121214; --texto: #f2f2f2; --suave: #a1a1aa; --acento: #7aa2ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
           font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    p { color: var(--suave); margin: 0 0 1.2rem; }
    a { color: var(--acento); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Prévias de site</h1>
    <p>Aqui ficam prévias de sites feitas por Gabriel Felipe para empresas de Uberaba. Cada prévia tem o próprio endereço, enviado diretamente à empresa.</p>
    <p><a href="https://gabrielfelipe.tech">Conheça o trabalho em gabrielfelipe.tech</a></p>
  </main>
</body>
</html>
